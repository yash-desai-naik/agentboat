# Builds the Windows installer when a version tag (v1.2.3) is pushed, and creates a DRAFT GitHub
# release with it, its SHA-256 checksum, release notes taken from CHANGELOG.md plus
# .github/release-footer.md, and the update feed (latest.json + the installer's signature) that
# installed copies of AgentBoat check. Review the draft on GitHub, then publish it: only then do
# installed copies see the update.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater key; see docs/DEVELOPMENT.md).
#
# macOS isn't built yet (it compiles, but hasn't been run on a Mac); it will be added like
# Fileboat's, on macos-latest.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in every file
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$conf" != "$v" ] || [ "$pkg" != "$v" ] || [ "$cargo" != "$v" ]; then
            echo "Tag v$v, but tauri.conf.json says $conf, package.json $pkg, Cargo.toml $cargo."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          const v = process.env.VERSION;
          const text = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
          const start = text.indexOf(`## [${v}]`);
          if (start < 0) {
            console.error(`CHANGELOG.md has no section '## [${v}]'.`);
            process.exit(1);
          }
          const rest = text.slice(text.indexOf("\n", start) + 1);
          const end = rest.match(/\n## \[|\n\[[^\]]+\]: /);
          const body = (end ? rest.slice(0, end.index) : rest).trim();
          if (!body) {
            console.error(`The '## [${v}]' section of CHANGELOG.md is empty.`);
            process.exit(1);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/changelog-section.md`, body);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/changelog-section.md

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app and the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect the installer and its updater signature
        shell: pwsh
        run: |
          $v = "${{ needs.check.outputs.version }}"
          $file = "AgentBoat_${v}_x64-setup.exe"
          $dir = "src-tauri/target/release/bundle/nsis"
          Copy-Item "$dir/$file" $file
          if (-not (Test-Path "$dir/$file.sig")) { Write-Error "No updater signature: is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1 }
          Copy-Item "$dir/$file.sig" "$file.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            AgentBoat_*_x64-setup.exe
            AgentBoat_*_x64-setup.exe.sig

  release:
    needs: [check, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums, release notes and the update feed
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv artifacts/windows-installer/* out/
          cd out
          shasum -a 256 * > SHA256SUMS.txt
          node - <<'JS'
          const fs = require("fs");
          const v = process.env.VERSION;
          const repo = process.env.REPO;
          const section = fs.readFileSync("../artifacts/notes/changelog-section.md", "utf8").trim();
          const exe = `AgentBoat_${v}_x64-setup.exe`;
          const sums = Object.fromEntries(
            fs.readFileSync("SHA256SUMS.txt", "utf8").trim().split("\n").map((line) => {
              const [hash, file] = line.trim().split(/\s+/);
              return [file.replace(/^\*/, ""), hash];
            }),
          );
          const footer = fs.readFileSync("../.github/release-footer.md", "utf8")
            .replace(/{version}/g, v)
            .replace(/{repo}/g, repo)
            .replace(/{sha256}/g, sums[exe]);
          fs.writeFileSync("release-notes.md", `${section}\n\n${footer}`);

          // The update feed installed copies read from releases/latest/download/latest.json.
          const feed = {
            version: v,
            notes: section,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms: {
              "windows-x86_64": {
                signature: fs.readFileSync(`${exe}.sig`, "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/v${v}/${exe}`,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
          JS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          v="${{ needs.check.outputs.version }}"
          files=(
            "out/AgentBoat_${v}_x64-setup.exe"
            "out/AgentBoat_${v}_x64-setup.exe.sig"
            "out/SHA256SUMS.txt"
            "out/latest.json"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the same tag: replace the files and notes.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file out/release-notes.md
          else
            gh release create "$tag" "${files[@]}" --draft --verify-tag \
              --title "AgentBoat $v" \
              --notes-file out/release-notes.md
          fi
