[package]
name = "agentboat"
version = "0.6.0"
description = "Watch a Claude Code session as an IDE, live or replayed, read-only"
license = "MIT"
edition = "2024"
publish = false
default-run = "agentboat"

# The code with no window in it (the session list, the transcript-to-timeline parser, git command
# recognition), testable with `cargo test --lib`.
[lib]
name = "agentboat_core"
path = "src/lib.rs"

# The desktop app.
[[bin]]
name = "agentboat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# raw_value: lines are scanned without copying the parts that aren't needed.
# preserve_order: tool inputs are shown with their keys in the order Claude wrote them.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
# %USERPROFILE% / $HOME for ~/.claude.
dirs = "7"
# Updates from GitHub releases, signature-checked against the key in tauri.conf.json.
tauri-plugin-updater = "2"
# AGENTBOAT_UPDATE_URL (a test feed) is parsed as a URL.
url = "2"

[target.'cfg(windows)'.dependencies]
# Already built for Tauri's windowing; whether a registered session's process is still running,
# and finding the window a running session is in ("Open in Claude Code").
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
